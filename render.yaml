# Free demo: the document index is ephemeral and resets on restarts/redeploys.
services:
  - type: web
    name: research-graph-rag
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/badash01/miniproject.git
    branch: codex/graph-rag-deploy
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: RAG_DATA_DIR
        value: /var/data/rag
      - key: DEMO_MODE
        value: "true"
      - key: RAG_MAX_CHUNKS
        value: "1000"
      - key: EMBED_BATCH_SIZE
        value: "4"
      - key: EMBED_THREADS
        value: "1"
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: APP_AUTH_USER
        value: admin
      - key: APP_AUTH_PASSWORD
        generateValue: true
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: LLM_MODEL
        value: openrouter/free
