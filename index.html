<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research Graph | Document RAG</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/vendor/lucide.js" defer></script>
    <script src="/vendor/cytoscape.js" defer></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="app-header">
      <a href="/" class="brand"><i data-lucide="network"></i>Research Graph</a
      ><span id="connection">Connecting</span>
    </header>
    <main class="workspace">
      <aside class="library">
        <div class="section-heading">
          <h1>Document Library</h1>
          <span id="documentCount">0</span>
        </div>
        <div class="upload" id="dropZone">
          <input
            type="file"
            id="files"
            multiple
            accept=".pdf,.docx,.txt,.md"
            aria-label="Upload documents"
          /><i data-lucide="upload-cloud"></i><strong>Add documents</strong
          ><small>PDF, DOCX, TXT, MD</small>
        </div>
        <div
          id="uploadStatus"
          class="status"
          role="status"
          aria-live="polite"
        ></div>
        <div class="library-actions">
          <label
            ><input type="checkbox" id="allDocuments" checked />All
            documents</label
          ><button
            id="pasteButton"
            class="icon-button"
            title="Add text document"
            aria-label="Add text document"
          >
            <i data-lucide="file-plus-2"></i>
          </button>
        </div>
        <div id="documents"></div>
        <footer class="library-footer">
          <span id="chunkCount">0 passages</span><span>LanceDB / MiniLM</span>
        </footer>
      </aside>
      <section class="research">
        <header class="research-header">
          <nav class="tabs" aria-label="Workspace views">
            <button class="active" data-view="answers">
              <i data-lucide="messages-square"></i>Ask Documents</button
            ><button data-view="graph">
              <i data-lucide="git-fork"></i>Knowledge Graph
            </button>
          </nav>
          <button
            id="clearChat"
            class="icon-button"
            title="Clear conversation"
            aria-label="Clear conversation"
          >
            <i data-lucide="eraser"></i>
          </button>
        </header>
        <div id="answersView" class="answers-view">
          <div class="conversation" id="conversation" aria-live="polite">
            <div class="empty" id="emptyChat">
              <i data-lucide="files"></i>
              <h2>Your Research Workspace</h2>
              <p id="emptyMessage">No documents indexed yet.</p>
            </div>
          </div>
          <form id="askForm" class="composer">
            <div class="composer-options">
              <span id="scope">All documents</span>
              <div class="segmented" aria-label="Retrieval mode">
                <button type="button" data-mode="hybrid" class="active">
                  Vector + Graph</button
                ><button type="button" data-mode="vector">Vector</button>
              </div>
            </div>
            <div class="question-row">
              <textarea
                id="question"
                rows="2"
                maxlength="2000"
                placeholder="Ask a question across your documents..."
                aria-label="Question"
                required
              ></textarea
              ><button
                id="askButton"
                class="primary icon-button"
                type="submit"
                aria-label="Send question"
                title="Send question"
              >
                <i data-lucide="arrow-up"></i>
              </button>
            </div>
            <p id="answerStatus" class="status" role="status"></p>
          </form>
        </div>
        <div id="graphView" class="graph-view" hidden>
          <div class="graph-toolbar">
            <span id="graphStats">No graph yet</span
            ><button
              id="fitGraph"
              class="icon-button"
              title="Fit graph"
              aria-label="Fit graph"
            >
              <i data-lucide="maximize"></i>
            </button>
          </div>
          <div id="graph" aria-label="Document and concept graph"></div>
          <div id="graphDetail">No node selected</div>
          <div class="legend">
            <span><b class="doc-dot"></b>Document</span
            ><span><b class="concept-dot"></b>Concept</span>
          </div>
        </div>
      </section>
    </main>
    <dialog id="pasteDialog">
      <form id="pasteForm">
        <div class="section-heading">
          <h2>Add Text Document</h2>
          <button
            type="button"
            id="closePaste"
            class="icon-button"
            aria-label="Close"
            title="Close"
          >
            <i data-lucide="x"></i>
          </button>
        </div>
        <label for="documentName">Document name</label
        ><input
          id="documentName"
          required
          maxlength="200"
          placeholder="Research notes"
        /><label for="documentText">Text</label
        ><textarea
          id="documentText"
          required
          minlength="60"
          placeholder="Paste document text..."
        ></textarea
        ><button class="primary" id="saveText">Index document</button>
      </form>
    </dialog>
  </body>
</html>
